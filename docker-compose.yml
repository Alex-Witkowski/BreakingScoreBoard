version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: breakingscoreboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-breakingscoreboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - breaking_network

  # BreakingScoreBoard Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: breakingscoreboard-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ASP.NET Core settings
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      
      # Database connection
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-breakingscoreboard};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      
      # Application settings
      AdminPin: ${ADMIN_PIN:-1234}
      ApiBaseUrl: ${API_BASE_URL:-http://localhost:8080}
      
      # Logging
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - breaking_network
    volumes:
      # Optional: Mount for logs persistence
      - app_logs:/app/logs

networks:
  breaking_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local
